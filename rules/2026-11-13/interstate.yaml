# Domestic goods only. The 4% rate of Senate Resolution 13/2012 (imported
# goods, or an import content above 40%) is not applied.
source: "Resolução do Senado Federal nº 22, de 19 de maio de 1989."
south_southeast_except_es: [SP, RJ, MG, PR, SC, RS]
rates:
  # South and Southeast except Espírito Santo, selling into the North,
  # Northeast, Centre-West or Espírito Santo.
  - origin_group: south_southeast_except_es
    destination_group: other
    rate: "0.07"
  # South and Southeast except Espírito Santo, selling inside that group.
  - origin_group: south_southeast_except_es
    destination_group: south_southeast_except_es
    rate: "0.12"
  # North, Northeast, Centre-West and Espírito Santo, selling to any other state.
  - origin_group: other
    destination_group: any
    rate: "0.12"
